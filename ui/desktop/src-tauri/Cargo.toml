[package]
name = "permagent-app"
version = "1.31.0"
edition = "2021"
description = "Permagent desktop application"
authors = ["Jesse Sharratt"]
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCStream", "SCShareableContent", "SCError", "objc2-core-media", "objc2-core-foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue"] }
# AppKit window/view geometry, for the traffic-light re-inset in chrome.rs.
# Every feature here is already enabled by tao 0.35 on the same 0.3.2 crate, so
# this is a re-declaration for direct use rather than a new build unit.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
# Objective-C blocks — needed for the one callback-shaped AppKit API we use,
# NSWorkspace's accessibility-change observer (see src/accessibility.rs).
block2 = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
