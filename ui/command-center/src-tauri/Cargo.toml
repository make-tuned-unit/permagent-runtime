[package]
name = "permagent-desktop"
version = "0.1.0"
description = "Permagent Command Center Desktop App"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "permagent_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
