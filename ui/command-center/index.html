<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        let preference = 'dark';
        try { preference = localStorage.getItem('permagent-theme') || 'dark'; } catch (_) {}
        const silver = preference === 'silver'
          || (preference === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        const theme = silver ? 'light' : 'dark';
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.background = silver ? '#F8FAFC' : '#0B1220';
        if (!silver) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permagent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
