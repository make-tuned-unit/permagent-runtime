id: defaults-py-percentage-returns-a-fraction
title: "percentage() returns a fraction, not a percentage"
category: model-defaults-py
max_turns: 25
harness_timeout_secs: 600
oracle_timeout_secs: 180
test: [bash, oracle_check.sh]
# The oracle is a shell script, so the Python/Node import allowlist does
# not apply; the overlay still makes it untamperable by the agent.
deliverables: [bench_py]
# lang=py difficulty=easy needs_repo_map=false needs_test_run=false
prompt: |
  The `percentage` helper in the numbers utilities is returning a plain fraction
  (like 0.25) instead of an actual percentage (like 25.0). Fix it so callers get
  the number they'd expect to show next to a "%" sign.
