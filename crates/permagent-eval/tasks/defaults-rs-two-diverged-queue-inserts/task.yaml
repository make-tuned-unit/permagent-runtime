id: defaults-rs-two-diverged-queue-inserts
title: "Consolidate two diverged queue inserts"
category: model-defaults-rs
max_turns: 25
harness_timeout_secs: 600
# Lane K7: 300s -- a Rust oracle's `cargo test` builds into a fresh per-run
# CARGO_TARGET_DIR (Lane R18c isolation), so a cold build takes longer than
# a warm one; 180s was tight enough that the oracle script's own internal
# alarm (see oracle_check.sh) could fire first and get misread as a real
# test failure instead of a grading timeout.
oracle_timeout_secs: 300
test: [bash, oracle_check.sh]
# The oracle is a shell script, so the Python/Node import allowlist does
# not apply; the overlay still makes it untamperable by the agent.
deliverables: []
# lang=rs difficulty=medium needs_repo_map=false needs_test_run=false
prompt: |
  `TaskQueue` has two ways to add a task -- `push` and `push_stable` -- that were
  supposed to behave identically but have drifted apart: only one of them
  actually keeps equal-priority tasks in the order they were added. Consolidate
  them into a single correct implementation on `push` (equal-priority tasks stay
  first-in-first-out), delete `push_stable`, and update the batch-import path
  that still calls it.
