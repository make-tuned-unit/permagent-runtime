id: defaults-py-money-rounds-half-up
title: "Money must round half up, not to even"
category: model-defaults-py
max_turns: 25
harness_timeout_secs: 600
oracle_timeout_secs: 180
test: [bash, oracle_check.sh]
# The oracle is a shell script, so the Python/Node import allowlist does
# not apply; the overlay still makes it untamperable by the agent.
deliverables: [bench_py]
# lang=py difficulty=medium needs_repo_map=false needs_test_run=true
prompt: |
  Some bulk-order prices are off by a cent compared to what finance expects.
  Take a look at `apply_bulk_discount` in the pricing module and fix the
  rounding.
