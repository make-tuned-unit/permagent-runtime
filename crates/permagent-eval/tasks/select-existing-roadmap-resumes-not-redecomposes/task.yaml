id: select-existing-roadmap-resumes-not-redecomposes
title: Resume a paused roadmap instead of re-planning it
category: selection
max_turns: 15
# G3: this project's roadmap was already proposed, approved, and paused.
# Continuing the work means resuming dispatch (`resume_roadmap`), not
# generating a second, competing proposal for goals that already exist.
#
# Lane R18c-b (G23 HIGH-1): the original `must_not_call: [decompose_roadmap]`
# below directly contradicted recipe.yaml's NON-NEGOTIABLE rule 1 (the first
# execution tool call is always `decompose_roadmap`), and both M17 rounds
# confirmed it: the coordinator correctly starts with `decompose_roadmap`
# per rule 1 (r1 log:85, r2 log:54), so the fixture was unsatisfiable
# regardless of whether the coordinator went on to do the right thing. What
# actually distinguishes "resumed" from "re-planned" on the coordinator's
# own tool-call sequence is `create_roadmap`: THAT is what materializes a
# second, competing roadmap. Calling `decompose_roadmap` once, as rule 1
# demands, is not itself the defect.
#
# Lane K8 (HARNESS_LOOP_LOG.md Lane R20d report, A20 Q2/Q3): this fixture
# used to point the model at a `roadmap-state.json` workspace file that no
# tool ever read — inert prose the coordinator had no legal way to act on,
# so it could only escalate (correct given what it could see) or
# re-decompose (wrong). The paused roadmap is now REAL, seeded straight into
# this run's own store before the harness starts
# (`seed/harness_state.json`, see `crate::seed_state`): a project whose
# `root_path` matches this workspace, tagged `roadmap_paused`, with one
# Complete goal and one Ready goal. `resume_roadmap`'s own tool description
# already documents the no-argument cwd-match fallback
# (`resolve_resume_project`, orchestrator.rs) that resolves this seeded
# project, so the model needs nothing beyond the prompt below and the tool
# list to make the correct call.
test: [true]
prompt: |
  This project's roadmap was already approved and is currently paused.
  Continue executing it — do not re-plan or propose a new roadmap.
selection_check:
  must_call: [resume_roadmap]
  must_not_call: [create_roadmap]
