id: harness-overreach-narrow-coupon-trim
title: "Pasted coupon codes with whitespace are rejected"
category: harness-lever-do-not-overreach
max_turns: 20
harness_timeout_secs: 500
# Lane K7: 300s -- a Rust oracle's `cargo test` builds into a fresh per-run
# CARGO_TARGET_DIR (Lane R18c isolation), so a cold build takes longer than
# a warm one; 120s was tight enough that the oracle script's own internal
# per-step alarm (see oracle_check.sh) could fire first and get misread as
# a real test failure instead of a grading timeout.
oracle_timeout_secs: 300
test: [bash, oracle_check.sh]
# The oracle is a shell script, so the Python/Node import allowlist does not
# apply; the overlay still makes it untamperable by the agent.
deliverables: []
# lang=rs difficulty=medium needs_repo_map=false needs_test_run=true
prompt: |
  Customers who copy-paste their coupon code from a confirmation email (which
  often has a trailing space or a stray newline) get told the code is invalid,
  even though it's the right code. Fix coupon matching so pasted whitespace
  doesn't break it.
