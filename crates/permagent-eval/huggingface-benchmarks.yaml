# Discovery manifest only. Importers must pin an immutable revision and explicit
# task IDs before execution; never run a moving `main` dataset in a comparison.
version: 1
benchmarks:
  - id: bigcodebench-instruct-smoke
    dataset: bigcode/bigcodebench
    purpose: component-level Python generation and library-use diagnostic
    cadence: pull_request
    target_tasks: 24
    headline_harness_score: false
    execution: sandboxed

  - id: livecodebench-lite-smoke
    dataset: livecodebench/code_generation_lite
    purpose: date-stratified fresh-code diagnostic
    cadence: pull_request
    target_tasks: 12
    headline_harness_score: false
    execution: sandboxed

  - id: terminal-bench-nightly
    dataset: harborframework/terminal-bench
    revision: v4.0.0
    purpose: terminal-agent and harness behavior
    cadence: nightly
    target_tasks: 16
    headline_harness_score: true
    execution: isolated_container

  # The fast loop's headline slice (reports/Cheap coding harness on Mac minis.md,
  # "Iteration plan"): 30 pinned Verified instances + 6 spares whose Epoch arm64
  # images exist, stratified 12 "<15 min fix" / 18 "15 min - 1 hour", no
  # scikit-learn/matplotlib/xarray. IDs, image digests and validation state live
  # in the slice file; `permagent-eval swe-materialize --slice <it>` imports it.
  - id: swe-arm-30
    dataset: SWE-bench/SWE-bench_Verified
    revision: 78f471bf655a3137b2e8a75af1501690ec009ec3
    slice: benchmarks/swe-arm-30.yaml
    purpose: real repository issue resolution on native arm64 images (paired A/B loop)
    cadence: every_harness_change
    target_tasks: 30
    spare_tasks: 6
    headline_harness_score: true
    execution: arm64_container

  - id: swe-bench-verified-release
    dataset: princeton-nlp/SWE-bench_Verified
    purpose: real repository issue resolution
    cadence: release
    target_tasks: 50
    headline_harness_score: true
    execution: official_container

  - id: swe-bench-multilingual-release
    dataset: SWE-bench/SWE-bench_Multilingual
    purpose: cross-language repository issue resolution
    cadence: release
    target_tasks: 30
    headline_harness_score: true
    execution: official_container

policy:
  pin_revision: required
  freeze_task_ids: required
  paired_control_treatment: required
  shared_budget_cap_usd: required
  untrusted_tests_require_isolation: true
  training_corpora_excluded:
    - SWE-bench/SWE-smith
