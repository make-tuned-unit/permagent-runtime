tabs:
  - name: Build
    tool_type: build
    panel_type: workspace
    reads: coding_sessions
    description: >-
      The Build tab is where the user works with code, terminals, and browsers
      in an integrated dev environment.
    affords:
      - Code editor and terminal access
      - Browser webview for documentation lookup
    suggest_when:
      - User asks about code, dev work, terminals, or browsing
    customizable_layout: false

  - name: Automate
    tool_type: automate
    panel_type: workspace
    reads: schedule.json
    description: >-
      The Automate tab shows the user's scheduled recipes, saved skills, and
      device-health insights — all automations the agent can run for them.
    affords:
      - Run a scheduled recipe on-demand
      - View next run time for each scheduled recipe
      - See saved skills in the Learned section; open one to view it in the Skills library
      - (Insights section coming in PR 1.6.C)
    suggest_when:
      - User asks about scheduled tasks, recipes, skills, or automation
      - User wants to know what's running on a schedule
    customizable_layout: false

  - name: Brain
    tool_type: memory
    panel_type: workspace
    reads: memory.db
    description: >-
      The Brain tab visualizes the user's Spectral memory graph — memories,
      entities, descriptions, consolidations. It's how the user inspects what
      the agent has learned and remembered.
    affords:
      - Browse memories by recency or topic
      - View entity descriptions
      - Search the memory graph
    suggest_when:
      - User asks "what do you remember" or "what do you know about X"
      - User wants to inspect or audit memory contents
    customizable_layout: false

  - name: World
    tool_type: world
    panel_type: workspace
    reads: agent.yaml
    description: >-
      The World tab is a 3D scene showing the user's agents and their current
      activity. Visual representation of the agent ecosystem.
    affords:
      - See agents as 3D characters with status indicators
      - Click an agent to inspect its state
    suggest_when:
      - User asks to see the agents or wants a visual overview
    customizable_layout: false

  - name: Settings
    tool_type: settings
    panel_type: overlay
    reads: config
    description: >-
      The Settings tab is where providers, models, appearance, and scheduling
      defaults are configured. It also hosts the Console pages (Sessions,
      Inbox, Activity/trace, Spend) and the sovereign controls — spend and
      budget, the sovereignty data boundary with its egress audit log, the
      worker roster, and the Guard's security-sweep toggle.
    affords:
      - Configure AI provider (Anthropic, OpenAI, Ollama)
      - Adjust appearance / theme
      - Set Librarian schedule
      - Review spend per project/session and set budget caps (Spend section)
      - Toggle the data boundary and read the egress audit log (Sovereignty section)
      - Enable or disable the Guard's security sweeps (Models section)
      - See and override per-role model routing (Models → Routing section) — which model each workflow role (orchestrate, edit, mechanical, review, local) dispatches to, hand-set or derived from the models actually available
    suggest_when:
      - User asks how to configure a provider, change model, or adjust the Librarian
      - User asks which model handles a role, why a role routes where it does, or wants to pin a role to a model
      - User asks what something is costing, wants a spend cap, or worries about a bill
      - User asks what data has left the machine or wants to audit egress
    customizable_layout: false

  - name: Projects
    tool_type: projects
    panel_type: workspace
    reads: projects
    description: >-
      The Projects tab shows all of the user's projects — codebases, repos,
      and workspaces the agent can operate in.
    affords:
      - Browse and open projects
      - See project status and recent activity
    suggest_when:
      - User asks about their projects, repos, or codebases
      - User wants to open or switch to a specific project
    customizable_layout: false

  - name: Dashboard
    tool_type: dashboard
    panel_type: workspace
    reads: overview_aggregate
    description: >-
      The Dashboard is the home view — a customizable surface showing the user's
      most important real-time information. Layout customization coming in PR 1.6.E.
    affords:
      - View current agent activity at a glance
      - (Customizable component layout — coming soon)
    suggest_when:
      - User asks "what's happening" or wants a summary
      - User asks about customizing their home view
    customizable_layout: true

  - name: Grow
    tool_type: grow
    panel_type: workspace
    reads: growth_actions
    description: >-
      The Grow tab is a per-project go-to-market workspace — strategy pillars
      (audience, positioning, channels), a content calendar of drafted posts,
      and a growth/analytics view.
    affords:
      - Think through audience, positioning, and channels for a project
      - Draft launch posts and outreach in the user's voice
      - Review a content calendar and growth signals
    suggest_when:
      - User wants to take a project to market, plan a launch, or draft a post
      - User asks about audience, growth, or content for a project
    customizable_layout: false

  - name: Inbox
    tool_type: settings
    panel_type: overlay
    section: inbox
    reads: inbox_files
    description: >-
      The Downloads inbox (a Settings page) lists files that landed in
      Permagent's intake folder (~/.permagent/inbox) via the in-app browser
      download flow — filename, source, size, and when each arrived.
    affords:
      - Review files downloaded into Permagent
      - See where each file came from and when it arrived
    suggest_when:
      - User asks where a downloaded file went or wants to see their inbox
      - User downloaded something in the in-app browser
    customizable_layout: false

  - name: Skills
    tool_type: skills
    panel_type: overlay
    reads: skills
    description: >-
      The Skills Library is where the user's saved skills live — the reusable
      task recipes the agent learns when the user repeats a task and saves it.
      Each skill is a portable SKILL.md folder the user can search, open, edit,
      or delete.
    affords:
      - Browse and search saved skills
      - Open a skill to view its steps, usage count, and run history
      - Edit or delete a saved skill
    suggest_when:
      - User asks what skills you have saved or learned
      - User wants to view, edit, or remove a specific skill
    customizable_layout: false

  - name: Sessions
    tool_type: settings
    panel_type: overlay
    section: sessions
    reads: session_files
    description: >-
      The Sessions history (a Settings page) lists the user's past
      conversations — each with its title and when it was last active — so they
      can reopen an earlier chat and pick up where they left off, or rename and
      delete old ones.
    affords:
      - Browse past conversations by recency
      - Reopen a past session back into the chat dock
      - Rename or delete old sessions
    suggest_when:
      - User asks to return to or find an earlier conversation
      - User wants to review, rename, or clean up past sessions
    customizable_layout: false

  - name: Trace
    tool_type: settings
    panel_type: overlay
    section: activity
    reads: activity_journal
    description: >-
      The Execution trace (the Activity page in Settings) shows the runtime's
      most recent events live from the running system's event streams —
      timestamped tool calls, worker activity, navigations, and lifecycle
      signals as they happen.
    affords:
      - Watch recent runtime events in real time
      - Inspect what the system just did under the hood
    suggest_when:
      - User wants to see the raw event stream or debug what just happened
      - User asks what the system is doing right now at a low level
    customizable_layout: false
