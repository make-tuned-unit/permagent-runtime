version: "1.1.0"
title: "Nightly Health Review"
description: "Builds a deterministic, validated 24-hour evidence set from every daemon log rotation, then reports confirmed errors, latency, loops, approvals, and user friction without carrying old findings forward."

parameters:
  - key: log_dir
    input_type: string
    requirement: optional
    description: "Directory holding daemon logs."
    default: "$HOME/.permagent/logs"
  - key: hours
    input_type: string
    requirement: optional
    description: "Exact evidence window in hours."
    default: "24"
  - key: report_dir
    input_type: string
    requirement: optional
    description: "Directory for evidence and the durable report."
    default: "$HOME/.permagent/reports/health"

extensions:
  - type: builtin
    name: developer
  # CASE B fix #2: this recipe mutates (writes the evidence JSON + the
  # report), so ReviewerMandate fires — but it declared only `developer`, so
  # the `delegate` tool the mandate asks for was never loaded. Without this,
  # the mandate now Parks honestly instead of asking for a missing tool
  # (CASE B fix #1), which is correct but still means this job's own report
  # never gets an independent review. Load `summon` so it can.
  - type: builtin
    name: summon

prompt: |
  Review Permagent's own logs for the exact last {{ hours }} hours. This is a
  diagnostic job, not a free-form log hunt: the bundled evidence collector owns
  file enumeration, timestamps, mirror de-duplication, aggregation, and latency
  pairing. Do not replace it with grep/head/tail or inspect an arbitrary log.

  First create the report directory and run:

    python3 "{{ recipe_dir }}/health_review_evidence.py" collect \
      --log-dir "{{ log_dir }}" --hours "{{ hours }}" \
      --output "{{ report_dir }}/health-evidence-latest.json"

  Read that JSON. Use only its in-window events and aggregates as evidence.
  Previous reports may explain whether a current signature is new, but an item
  seen only in an older report is never a current finding. The server rotations
  are canonical when present; daemon-sidecar is a formatting mirror and is
  intentionally excluded then. Never infer that a request reached the network
  when an egress event says `allowed=false`; that means the guard suppressed it.

  ## Diagnostic rules

  - Every finding must cite one or more exact IDs as `[event:evt_…]` and quote
    the minimum message text that proves it. No ID, no finding.
  - Separate observation, impact, and proposed next check. Do not turn a
    plausible causal chain into fact.
  - Aggregate repeated signatures. State the evidence count and quote one
    representative event; do not list fifty copies.
  - Recovery matters: when a failure is followed by an explicit recovery or
    fail-closed event, report both and describe the actual user impact.
  - Treat a user correction, unwanted interruption, code-1009 disconnect,
    repeated rephrasing, or "stop/wrong/too much" transcript as user friction.
  - For voice, report the exact evidence-derived turn count, first-audio median
    and worst, plus STT/TTS splits. First audio over 2 seconds is a latency defect.
  - Do not invent database paths, tables, file:line locations, successful calls,
    or storage outcomes. `source` and `source_line` may be cited when present.
  - Quote no secrets or unrelated private content. The collector redacts common
    credentials; minimize transcript quotes further.

  Write `{{ report_dir }}/health-<YYYY-MM-DD>.md` using this shape:

    # Health review — <date>
    **Window:** <exact evidence start> to <exact evidence end> (end exclusive)
    **Coverage:** <canonical source, files scanned, events in window>
    **Verdict:** <clean, or the single highest-impact confirmed issue>

    ## Findings
    ### <finding title>
    - **What broke** — one observation.
    - **Evidence** — `[event:evt_…]` and the minimal exact quote.
    - **Impact** — what the user actually experienced; say "unknown" when it is.
    - **Where** — evidence source and line, or subsystem.
    - **Next check/fix** — concrete and bounded; no guessed patch.

    If there are none, write exactly: `No confirmed findings.`

    ## Latency
    - Voice turns: <evidence value>
    - First-audio median: <evidence value>ms
    - First-audio worst: <evidence value>ms
    <STT, total, and TTS distribution; identify the worst turn by event ID.>

    ## Clean
    <Only categories that the evidence actually covered and found empty.>

    ## Fix prompts
    <One dispatch-ready brief per confirmed, actionable finding, carrying the
    same evidence IDs. Omit this section when there is nothing actionable.>

  Now validate the written report:

    python3 "{{ recipe_dir }}/health_review_evidence.py" validate \
      --evidence "{{ report_dir }}/health-evidence-latest.json" \
      --report "{{ report_dir }}/health-<YYYY-MM-DD>.md"

  A non-zero result means the review failed. Read each validator error, correct
  the report, and rerun until it prints `health report validation: ok`. Only then
  summarize in chat in at most five sentences. Do not claim success without a
  passing validation.

  ## Known benign (do not escalate)

  These have been misread as runaway bugs. They are not. Quote them only if
  an issue string falls *outside* the expected set, or new evidence shows
  the old bug still firing after the fix's deploy time.

  - **MOIM `Merged text content` / `Merged consecutive user messages` /
    `Trimmed trailing whitespace`.** `fix_conversation` reports one of these
    per lossless coalesce. An `issues` list whose length grows with
    `messages_before` is one report per un-coalesced historical message, not
    a persisted or recursive merge. Session 20260827_1's 129 warnings were
    the sanitizer dropping Top-of-Mind because `"Merged text content"` was
    treated as unexpected; that string is now allow-listed in
    `crates/goose/src/agents/moim.rs`. Do not file this as CRITICAL again
    unless the injection is still being dropped, or an issue string is
    outside that expected set.
  - **Commands from this review.** Your own shell invocations are appended
    to the live server log. Count only lines whose timestamp is before this
    session started.
  - **A previous report in {{ report_dir }} already diagnosed a finding
    whose source comments name it as fixed.** Re-open it only with a log
    line after that fix shipped (check `/Users/j/Documents/dev/permagent-runtime`
    if present — read only, never clone, never edit).

  ## Boundaries

  Boundaries: read-only for code, databases, services, and logs. Creating the
  evidence JSON and report is the only allowed mutation. Never restart a
  service, delete a log, edit code, or file a Decision-Inbox item.
