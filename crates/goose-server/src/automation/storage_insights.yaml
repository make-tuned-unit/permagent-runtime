version: "1.0.0"
title: "Weekly Storage Cleanup"
description: "Finds stale files, large downloads, and cleanup opportunities across your Downloads, Desktop, and Documents."

extensions:
  - type: builtin
    name: developer

prompt: |
  Analyze storage on this Mac and identify cleanup opportunities. Run these commands and synthesize findings:

  1. Largest folders in home directory (excluding system paths):
     ```
     du -h -d 2 ~ 2>/dev/null | grep -v "/Library/" | sort -rh | head -20
     ```

  2. Large files in Downloads, Desktop, Documents (>50 MB):
     ```
     find ~/Downloads ~/Desktop ~/Documents \
       -type f -size +50M 2>/dev/null \
       -exec ls -lh {} \; | head -30
     ```

  3. Files in Downloads older than 30 days:
     ```
     find ~/Downloads -type f -mtime +30 2>/dev/null | head -50
     ```

  4. Overall disk usage:
     ```
     df -h / | tail -1
     ```

  Produce a report with two parts:

  PART 1 — Summary:

  **Summary:** "Found approximately X GB of potential cleanup across Y items. Your disk is Z% full."

  Then list key findings as bullets with file name, size, age, location, and recommendation.

  PART 2 — Structured findings block:

  After the human-readable report, output a findings block in this exact format. This block will be parsed by Permagent to create actionable items with Trash/Keep buttons.

  <findings>
  [
    {
      "id": "finding-001",
      "type": "stale_file",
      "path": "/full/path/to/file.ext",
      "size_bytes": 256000000,
      "age_days": 45,
      "recommendation": "Safe to remove"
    }
  ]
  </findings>

  Rules for the findings block:
  - Use sequential IDs: finding-001, finding-002, etc.
  - type must be one of: "stale_file", "large_file", "duplicate"
  - path must be the FULL absolute path
  - size_bytes must be in bytes (not MB or GB)
  - age_days is optional (null if unknown)
  - recommendation must be "Safe to remove" or "Review before removing"
  - Include at most 40 findings, prioritized by size (largest first)
  - Do NOT include files in .ssh, .aws, .gnupg, .env, credentials, or keychain paths
  - Do NOT delete any files — only report findings
