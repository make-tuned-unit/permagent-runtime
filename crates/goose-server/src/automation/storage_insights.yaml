version: "2.0.1"
title: "Weekly Storage Cleanup"
description: "Scans your Mac for cleanup opportunities — dev caches, app caches, stale downloads, and large files."

prompt: |
  Run a storage health scan to find cleanup opportunities on this Mac.

  1. Call the scan_storage_health tool to scan the filesystem. This is the ONLY
     way to produce storage findings — do NOT run find, du, ls, or any shell
     commands to scan storage.

  2. After the tool returns, write a brief summary for the user:
     - Start with: **Your disk has X GB of cleanup opportunities across N items.**
     - List the top 3 categories by size (e.g., "Dev Caches: 14.2 GB across 3 projects")
     - If any item is flagged "Review before removing", mention it specifically
     - Keep the summary to 3-5 sentences, no technical jargon

  3. Emit the findings JSON from the tool result in <findings>...</findings> tags
     so the UI can render actionable Trash/Keep buttons for each item.

  Do NOT add section headers like "PART 1" or "Human-Readable Summary".
  Do NOT delete any files — only report findings for user review.
