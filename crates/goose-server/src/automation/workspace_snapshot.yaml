version: "1.0.0"
title: "Workspace Snapshot"
description: "Where you left off — files modified yesterday and current device state"

extensions:
  - type: builtin
    name: developer

prompt: |
  Generate a morning workspace snapshot. Run the following commands and synthesize the results into a brief, human-readable report.

  1. Files modified in the last 24 hours (excluding sensitive/system paths):
     ```
     find ~ -mtime -1 -type f \
       -not -path "*/Library/*" \
       -not -path "*/.git/*" \
       -not -path "*/node_modules/*" \
       -not -path "*/.ssh/*" \
       -not -path "*/.aws/*" \
       -not -path "*/.permagent/*" \
       -not -name "*.env*" \
       -not -name "*credentials*" \
       -not -name "*.keychain*" \
       2>/dev/null | head -50
     ```

  2. Disk usage: `df -h / | tail -1`

  3. Memory pressure: `vm_stat | head -10`

  4. Battery status: `pmset -g batt 2>/dev/null || echo "No battery detected"`

  Synthesize into a report with this structure:

  **Yesterday you worked on:** [group modified files by parent directory, e.g., "3 files in ~/dev/canon, 2 files in ~/Documents"]

  **Disk:** [X% full, Y GB free]

  **Battery:** [Z% charging/discharging, or "Desktop — no battery"]

  **Memory:** [healthy/moderate pressure/high pressure based on vm_stat pageouts]

  Keep it concise — this is a quick morning glance, not a detailed analysis.
