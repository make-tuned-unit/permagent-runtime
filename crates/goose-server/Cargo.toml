[package]
name = "permagent-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
# `spectral-recognition` is ON by default HERE and nowhere else. The daemon is
# what actually runs, and a flag nobody flips is not a wired feature — this one
# stayed off for months behind a docstring claiming the dependency was missing
# (see crates/goose/src/recognition_sink.rs). The library keeps it off so
# `-p permagent` still builds and tests both ways.
#
# What turning it on switches on, and why each is safe:
#   * recognize() alongside every recall — detached, budgeted, observer-only:
#     a recall returns whether recognition succeeds, fails or hangs, and no
#     brain at all means inject_recall is never reached in the first place.
#   * the v22 verdict columns — already applied unconditionally on every boot
#     by `apply_recognition_v22_columns`, so this changes nothing.
#   * per-project wing rules — a FIX: with the flag off the live brain runs on
#     Spectral's fixture wings (alice/apollo/acme/…), which are actively wrong
#     labels on real memories. See the builder call in state.rs.
#   * the content-free tool-event feed and the consent-gated ambient cue log.
default = ["code-mode", "local-inference", "aws-providers", "telemetry", "otel", "rustls-tls", "spectral-recognition"]
code-mode = ["permagent/code-mode"]
local-inference = ["permagent/local-inference"]
aws-providers = ["permagent/aws-providers"]
cuda = ["permagent/cuda", "local-inference"]
telemetry = ["permagent/telemetry"]
otel = ["permagent/otel"]
spectral-recognition = ["permagent/spectral-recognition"]
rustls-tls = [
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
    "axum-server/tls-rustls",
    "dep:rustls",
    "dep:aws-lc-rs",
    "permagent/rustls-tls",
    "permagent-mcp/rustls-tls",
]
native-tls = [
    "reqwest/native-tls",
    "tokio-tungstenite/native-tls",
    "axum-server/tls-openssl",
    "dep:openssl",
    "permagent/native-tls",
    "permagent-mcp/native-tls",
]

[dependencies]
async-trait = { workspace = true }
permagent = { path = "../goose", default-features = false }
permagent-mcp = { path = "../goose-mcp" }
spectral = { workspace = true }
rmcp = { workspace = true }
axum = { workspace = true, features = ["ws", "macros", "multipart"] }
tokio = { workspace = true }
chrono = { workspace = true }
tower-http = { workspace = true, features = ["cors", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
futures = { workspace = true }
async-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }
config = { version = "0.15.23", features = ["toml"] }
thiserror = { workspace = true }
clap = { workspace = true }
serde_yaml = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
reqwest = { workspace = true, features = ["json", "blocking", "multipart", "system-proxy"], default-features = false }
tokio-util = { workspace = true }
serde_path_to_error = "0.1.20"
tokio-tungstenite = { version = "0.29.0" }
url = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = "0.4.3"
ed25519-dalek = "2.2"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
data-encoding = "2"
subtle = "2.6"
socket2 = "0.6.4"
fs2 = { workspace = true }
rustls = { version = "0.23", features = ["aws_lc_rs"], optional = true }
uuid = { workspace = true }
trash = "5"
libc = "0.2"
rcgen = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
axum-server = { version = "0.8.0" }
aws-lc-rs = { version = "1.17.0", optional = true }
openssl = { version = "0.10", optional = true }
pem = "3.0.6"
dirs = { workspace = true }
urlencoding = { workspace = true }
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["shared"] }
hound = "3.5"
# Wake-word model tarball extraction (sherpa-onnx kws release ships .tar.bz2).
tar = "0.4"
bzip2 = "0.6"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
misaki-rs = { version = "0.3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
strsim = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "chrono",
    "json",
] }
regex = { workspace = true }
globset = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString"] }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56.0" }

[[bin]]
name = "permagentd"
path = "src/main.rs"

[[bin]]
name = "generate_schema"
path = "src/bin/generate_schema.rs"

[[bin]]
name = "tts_bench"
path = "src/bin/tts_bench.rs"

[[bin]]
name = "voice_model_bench"
path = "src/bin/voice_model_bench.rs"

[dev-dependencies]
# Runs the config pin before any test body — see lib.rs. cfg(test) in the
# permagent crate does not apply to this binary, so the pin has to be armed here.
ctor = "1.0"
tower = "0.5.2"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
env-lock = { workspace = true }
serial_test = { workspace = true }
wiremock = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    # Used only in windows
    "winreg",
]
