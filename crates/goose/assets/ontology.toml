# Permagent v1.0 Ontology
#
# Defines the schema of memory: what kinds of entities can exist and what
# typed relationships connect them. Specific entities (the user's name,
# their projects, people they discuss) are created at runtime as the user
# interacts with Permagent — they are NOT pre-declared in this file.
#
# This file ships in every Permagent binary as an embedded asset and is
# written to ~/.permagent/ontology.toml on first run. Spectral validates
# all graph writes against the (domain, range) constraints declared here.
#
# v1.1 will add activity-capture entity types (activity) and predicates
# (occurred_in_project, started_at, involves_person).

version = 1

# ── Entity types ─────────────────────────────────────────────────────
# Each type describes a kind of thing Permagent reasons about. Specific
# entities of these types are created at runtime when first referenced
# (pending Spectral's AutoCreateWithCanonicalizer support — Phase 2 Track A).

[[entity_types]]
name = "person"
aliases = ["user", "human"]

[[entity_types]]
name = "project"
aliases = ["repo", "codebase", "product"]

[[entity_types]]
name = "chat_session"
aliases = ["conversation", "session"]

[[entity_types]]
name = "skill"
aliases = ["capability", "tool", "extension"]

[[entity_types]]
name = "topic"
aliases = ["subject", "theme"]

# ── Predicates ───────────────────────────────────────────────────────
# Each predicate describes a typed relationship. domain = subject type,
# range = object type. Spectral validates these at write time when
# brain.assert() is called.

[[predicates]]
name = "worked_on"
domain = "person"
range = "project"

[[predicates]]
name = "discussed_in"
domain = "topic"
range = "chat_session"

[[predicates]]
name = "uses_skill"
domain = "chat_session"
range = "skill"

[[predicates]]
name = "mentions_person"
domain = "chat_session"
range = "person"

[[predicates]]
name = "mentions_project"
domain = "chat_session"
range = "project"

[[predicates]]
name = "mentions_topic"
domain = "chat_session"
range = "topic"

[[predicates]]
name = "related_to"
domain = "topic"
range = "topic"
