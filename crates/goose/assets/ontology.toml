# Permagent v1.0 Ontology — Schema Only
#
# Defines the schema of memory: what kinds of entities can exist and what
# typed relationships connect them. Specific entities (the user's name,
# their projects, people they discuss) are created at runtime as the user
# interacts with Permagent — they are NOT pre-declared in this file.
#
# This file ships in every Permagent binary as an embedded asset and is
# written to ~/.permagent/brain/ontology.toml on first run. Spectral
# validates all graph writes against the (domain, range) constraints
# declared here.
#
# Runtime entity creation is gated on Spectral's AutoCreateWithCanonicalizer
# support (Phase 2 Track A). Until then, entities are inferred by the
# constellation fingerprint layer without explicit graph nodes.

version = 1

# ── Entity types ─────────────────────────────────────────────────────
# Each type describes a kind of thing Permagent reasons about. Specific
# entities of these types are created at runtime when first referenced.

[[entity_types]]
name = "person"
aliases = ["user", "human", "contact"]

[[entity_types]]
name = "project"
aliases = ["repo", "codebase", "product"]

[[entity_types]]
name = "organization"
aliases = ["company", "team", "org"]

[[entity_types]]
name = "document"
aliases = ["file", "page", "note"]

[[entity_types]]
name = "concept"
aliases = ["idea", "topic", "subject", "theme"]

[[entity_types]]
name = "event"
aliases = ["meeting", "milestone", "incident"]

[[entity_types]]
name = "location"
aliases = ["place", "region", "city"]

[[entity_types]]
name = "tool"
aliases = ["extension", "service", "api", "skill"]

# ── Predicates ───────────────────────────────────────────────────────
# Each predicate describes a typed relationship. domain = subject type,
# range = object type. Spectral validates these at write time when
# brain.assert() is called.

[[predicates]]
name = "worked_on"
domain = "person"
range = "project"

[[predicates]]
name = "created"
domain = "person"
range = "document"

[[predicates]]
name = "mentioned"
domain = "document"
range = "concept"

[[predicates]]
name = "related_to"
domain = "concept"
range = "concept"

[[predicates]]
name = "located_in"
domain = "organization"
range = "location"

[[predicates]]
name = "occurred_at"
domain = "event"
range = "location"

[[predicates]]
name = "authored"
domain = "person"
range = "document"

[[predicates]]
name = "depends_on"
domain = "project"
range = "project"

[[predicates]]
name = "part_of"
domain = "project"
range = "organization"
