[package]
name = "permagent-brain-tests"
version = "0.0.0"
edition.workspace = true
publish = false

# This crate exists solely to run Brain-dependent tests in a binary
# that does NOT link V8. V8's bundled libc++abi overrides system C++
# exception handling, causing kuzu's cxxbridge exceptions to hit
# std::terminate → SIGABRT on Linux. See issue #190.

[dev-dependencies]
permagent = { path = "../goose", default-features = false, features = ["rustls-tls"] }
spectral = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
