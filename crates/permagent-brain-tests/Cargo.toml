[package]
name = "permagent-brain-tests"
version = "0.0.0"
edition = "2021"
publish = false

# This crate is EXCLUDED from the workspace to prevent Cargo feature
# unification from pulling V8 (via code-mode) into these tests.
# V8's bundled libc++abi overrides system C++ exception handling,
# causing kuzu's cxxbridge exceptions to hit std::terminate → SIGABRT
# on Linux. See issue #190.

[dev-dependencies]
permagent = { path = "../goose", default-features = false, features = ["rustls-tls"] }
spectral = { git = "https://github.com/make-tuned-unit/spectral", rev = "2c1f6bf" }
tokio = { version = "1.49", features = ["full"] }
tempfile = "3"
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Mirror patches from workspace root — this crate is excluded from
# the workspace so it doesn't inherit [patch] entries automatically.
[patch.crates-io]
sacp = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
sacp-derive = { git = "https://github.com/agentclientprotocol/symposium-acp", rev = "14086c9" }
opentelemetry = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry_sdk = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry-appender-tracing = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry-otlp = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
opentelemetry-stdout = { git = "https://github.com/open-telemetry/opentelemetry-rust", rev = "345cd74a" }
