[package]
name = "permagent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "permagent"
path = "src/main.rs"

[[bin]]
name = "generate_manpages"
path = "src/bin/generate_manpages.rs"

[dependencies]
clap_mangen = "0.2.31"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "5.0"
libc = "0.2"
permagent = { path = "../goose", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
permagent-mcp = { path = "../goose-mcp" }
rmcp = { workspace = true }
clap = { workspace = true }
cliclack = "0.3.5"
console = "0.16.1"
dotenvy = { workspace = true }
bat = { version = "0.26.1", default-features = false, features = ["regex-onig"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }
etcetera = { workspace = true }
rand = { workspace = true }
rustyline = "15.0.0"
tracing = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = { workspace = true }
shlex = "1.3.0"
async-trait = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
tar = "0.4.46"
reqwest = { workspace = true, features = ["blocking"], default-features = false }
zip = { workspace = true }
bzip2 = "0.5"
webbrowser = { workspace = true }
indicatif = "0.18.1"
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["compat", "rt"] }
anstream = "0.6.18"
open = "5.3.5"
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
clap_complete = "4.6.5"
comfy-table = "7.2.2"
sha2 = { workspace = true }
sigstore-verify = { version = "0.6", default-features = false }
axum.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { workspace = true }

[features]
default = ["code-mode", "local-inference", "aws-providers", "telemetry", "otel", "rustls-tls"]
code-mode = ["permagent/code-mode"]
local-inference = ["permagent/local-inference"]
aws-providers = ["permagent/aws-providers"]
cuda = ["permagent/cuda", "local-inference"]
telemetry = ["permagent/telemetry"]
otel = ["permagent/otel"]
# disables the update command
disable-update = []
rustls-tls = [
    "reqwest/rustls",
    "sigstore-verify/rustls",
    "permagent/rustls-tls",
    "permagent-mcp/rustls-tls",
]
native-tls = [
    "reqwest/native-tls",
    "sigstore-verify/native-tls",
    "permagent/native-tls",
    "permagent-mcp/native-tls",
]

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    # Used only in windows
    "winapi",
]
