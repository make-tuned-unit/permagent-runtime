name: PermagentMobile
options:
  bundleIdPrefix: ai.permagent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Permagent:
    type: application
    platform: iOS
    sources:
      - path: PermagentMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.permagent.mobile
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: PermagentMobile/Info.plist
      properties:
        CFBundleDisplayName: Permagent
        NSMicrophoneUsageDescription: Permagent uses the microphone to dictate notes and talk with Henry.
        NSLocalNetworkUsageDescription: Permagent connects to your Permagent hub on your local network or tailnet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
