schema: 1
program_id: permagent-improvement-portfolio-2026-09-04
objective: >-
  Keep the approved coding-harness, voice, companion, Spectral learning,
  World and suite-polish programs moving through dependency-ready work, without sharing write
  scopes or declaring acceptance without their child-program receipts.
terminal_node: portfolio_acceptance
nodes:
  - id: coding_harness_program
    child_dag: docs/orchestrator/CODING_HARNESS_MASTER_PROGRAM_DAG.yaml
    status: active
    depends_on: []
    next_on_pass: [portfolio_acceptance]
    entry_gate: [coding program manifest validates and exposes a frontier]
    exit_gate: [coding program reaches its release qualification with all areas Excellent]
    worker_policy: cheapest qualified DAG workers with independent integration

  - id: voice_reliability_program
    child_dag: docs/orchestrator/VOICE_UX_RELIABILITY_MASTER_PROGRAM_DAG.yaml
    status: active
    depends_on: []
    next_on_pass: [portfolio_acceptance]
    entry_gate: [voice program manifest validates and exposes a frontier]
    exit_gate: [voice program reaches fresh-device master acceptance]
    worker_policy: parallel UI and daemon specialists with serialized shared files

  - id: companion_program
    child_dag: docs/orchestrator/PERMAGENT_COMPANION_MASTER_PROGRAM_DAG.yaml
    status: active
    depends_on: []
    next_on_pass: [portfolio_acceptance]
    entry_gate: [companion master validates and audit receipt is reviewed]
    exit_gate: [companion master reaches cross-platform acceptance with exact receipts]
    worker_policy: dependency-ready bounded workers reuse shared harness and memory receipts

  - id: spectral_learning_program
    child_dag: docs/orchestrator/SPECTRAL_LEARNING_MASTER_PROGRAM_DAG.yaml
