    exit_gate: [cross-program regression checks and evidence index pass]
    worker_policy: independent final integrator

  - id: suite_polish_program
    child_dag: docs/orchestrator/UI_POLISH_MASTER_PROGRAM_DAG.yaml
    status: active
    depends_on: []
    next_on_pass: [portfolio_acceptance]
    entry_gate: [operator authorized parallel research and whole-suite polish planning]
    exit_gate: [macOS then iOS then watchOS polish passes with exhaustive capability and surface evidence]
    worker_policy: root design and independent review with cheaper bounded inventory and implementation workers

# Portfolio acceptance
#
# This manifest records portfolio dependencies, not proof of a live scheduler
# or running workers. Runtime dispatch requires approved goal bindings and
# verified gate receipts; durable work state remains in existing goal stores.
