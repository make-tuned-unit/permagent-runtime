name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Single source of truth for the sherpa-onnx prebuilt lib version.
  # Must match the sherpa-onnx crate version in crates/goose-server/Cargo.toml.
  SHERPA_ONNX_VERSION: 1.13.2

jobs:
  test:
    strategy:
      # Let each OS report its own result — a canceled macOS leg loses
      # exactly the cross-platform signal the matrix exists for.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The ubuntu runner is disk-bound at link: the ~50GB build sits at the
      # runner's ceiling even after the aggressive free-disk step, and the bulk
      # is DEBUGINFO. Strip it from every layer (ubuntu only — macOS isn't disk-
      # constrained and stays at defaults so its green leg can't be perturbed):
      #  - line-tables-only: Rust crates (keeps panic file:line for the ubuntu
      #    RUST_BACKTRACE=full diagnostics).
      #  - CFLAGS/CXXFLAGS=-g0: the C++ debuginfo in llama/kuzu (compiled from
      #    source) that a Rust profile setting can't reach.
      #  - RUSTFLAGS=-C strip=debuginfo: link-time strip, the only lever that
      #    reaches v8's prebuilt-lib debuginfo contribution. (.cargo/config.toml
      #    rustflags are Windows-msvc-target only, so this clobbers nothing here.)
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-g0' || '' }}
      CXXFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-g0' || '' }}
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-C strip=debuginfo' || '' }}
    steps:
      - name: Free disk space (aggressive, ubuntu only)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # Reclaim ~30GB: the workspace debug build (kuzu+candle+v8+llama+
          # sherpa) sits at the runner's disk ceiling and ENOSPC'd at the link
          # stage. tool-cache/android/dotnet/haskell do the bulk of the freeing
          # and are unused by this build (Rust toolchain installed fresh below).
          # large-packages is intentionally OFF: it removes the llvm-* apt
          # packages, which strips clang's builtin headers (stdbool.h) that
          # llama-cpp-sys-2's bindgen needs — and it only saves a few GB anyway.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Stage sherpa-onnx prebuilt libs OUTSIDE the cargo target dir.
      # sherpa-onnx-sys's build.rs normally downloads them into
      # <target-dir>/sherpa-onnx-prebuilt and records an absolute -L path,
      # but rust-cache prunes that directory while restoring build
      # fingerprints as fresh -> stale -L -> "unable to find library
      # -lsherpa-onnx-c-api" at link time. Pointing SHERPA_ONNX_LIB_DIR at a
      # directory staged on every run makes the recorded -L always valid.
      - name: Resolve sherpa-onnx prebuilt lib paths
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    stem="sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared-lib" ;;
            macOS-ARM64)  stem="sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-arm64-shared-lib" ;;
            *) echo "Unsupported runner for sherpa-onnx prebuilt libs: ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          echo "SHERPA_ONNX_STEM=${stem}" >> "$GITHUB_ENV"
          echo "SHERPA_ONNX_LIB_DIR=${HOME}/sherpa-onnx-prebuilt/${stem}/lib" >> "$GITHUB_ENV"
          # SHERPA_ONNX_LIB_DIR makes LINKING cache-independent, but test
          # binaries also load the shared libs at RUNTIME. Cargo's replay of
          # build-script -L paths into the loader path breaks on reruns with
          # warm pre-staged-cache fingerprints (stale path into the pruned
          # target dir), so stage the loader path explicitly too.
          libdir="${HOME}/sherpa-onnx-prebuilt/${stem}/lib"
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=${libdir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          else
            echo "DYLD_FALLBACK_LIBRARY_PATH=${libdir}${DYLD_FALLBACK_LIBRARY_PATH:+:${DYLD_FALLBACK_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          fi
      - name: Cache sherpa-onnx prebuilt libs
        id: sherpa-cache
        uses: actions/cache@v6
        with:
          path: ~/sherpa-onnx-prebuilt
          key: sherpa-onnx-v${{ env.SHERPA_ONNX_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download sherpa-onnx prebuilt libs
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${HOME}/sherpa-onnx-prebuilt"
          curl -fsSL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/${SHERPA_ONNX_STEM}.tar.bz2" \
            | tar xj -C "${HOME}/sherpa-onnx-prebuilt"
          ls "${SHERPA_ONNX_LIB_DIR}"
      - name: Unit and integration tests
        run: cargo test --locked --workspace --exclude permagent-brain-tests --lib --tests
        env:
          RUST_BACKTRACE: ${{ matrix.os == 'ubuntu-latest' && 'full' || '0' }}
          RUST_LIB_BACKTRACE: ${{ matrix.os == 'ubuntu-latest' && 'full' || '0' }}
      - name: Brain tests (V8-free, isolated from workspace feature unification)
        run: cargo test --locked -p permagent-brain-tests
        env:
          RUST_BACKTRACE: ${{ matrix.os == 'ubuntu-latest' && 'full' || '0' }}
          RUST_LIB_BACKTRACE: ${{ matrix.os == 'ubuntu-latest' && 'full' || '0' }}
      - name: Doc tests
        run: cargo test --locked --workspace --doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "Disk before:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk after:"
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features)
        run: cargo build --locked -p permagent
      - name: Build (minimal features)
        run: cargo build --locked -p permagent --no-default-features --features rustls-tls
